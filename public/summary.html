<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>InvestNow&trade; Circle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #14181f;
        --muted: #5b6573;
        --dim: #8a94a3;
        --line: #d9dde3;
        --hair: #eceff3;
        --accent: #9a7b1b;
        --bar: #c9a227;
        --bar-bg: #eef0f3;
        --page: #ffffff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #e8eaee; }
      body {
        font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
        color: var(--ink);
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
      }

      .sheet {
        width: 210mm; min-height: 297mm;
        margin: 16px auto; padding: 11mm 12mm 9mm;
        background: var(--page);
        box-shadow: 0 2px 14px rgb(20 24 31 / 14%);
      }

      /* Masthead */
      .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      h1 { font-size: 15px; margin: 0; letter-spacing: -0.01em; }
      .top .meta { font-size: 10px; color: var(--dim); text-align: right; white-space: nowrap; }
      .rule { height: 2px; background: var(--ink); margin: 5px 0 0; }

      /* Headline figures */
      .kpis {
        display: grid; grid-template-columns: 62px 1fr 1fr 1fr;
        gap: 14px; padding: 8px 0 9px; border-bottom: 1px solid var(--line);
      }
      .kpi .v { font-size: 15px; font-weight: 700; line-height: 1.2; }
      .kpi .v.n { font-size: 25px; font-variant-numeric: tabular-nums; }
      .kpi .k { font-size: 9px; color: var(--dim); margin-top: 1px; }

      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
      section { padding-top: 9px; }
      h2 {
        font-size: 10px; margin: 0 0 5px; text-transform: uppercase;
        letter-spacing: 0.07em; color: var(--accent);
      }

      /* Bar rows */
      .row { display: grid; grid-template-columns: 1fr 26px; gap: 6px; align-items: center; margin-bottom: 3px; }
      .row .lab { font-size: 10.5px; line-height: 1.25; }
      .row .num { font-size: 10px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      .track { height: 4px; background: var(--bar-bg); border-radius: 2px; margin-top: 2px; overflow: hidden; }
      .fill { height: 100%; background: var(--bar); }
      .row.lead .lab { font-weight: 600; }

      /* Inline list */
      .inline { font-size: 10.5px; color: var(--ink); }
      .inline b { font-weight: 600; }
      .inline span { color: var(--dim); }

      /* Quotes */
      .quotes { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
      .q { font-size: 10px; line-height: 1.4; margin-bottom: 5px; }
      .q .who { color: var(--accent); font-weight: 600; }
      .themes { font-size: 10.5px; margin-bottom: 7px; }
      .themes b { font-weight: 600; }

      table { width: 100%; border-collapse: collapse; font-size: 8.6px; line-height: 1.3; }
      th, td { text-align: left; padding: 3px 7px 3px 0; border-bottom: 1px solid var(--hair); vertical-align: top; }
      th { color: var(--dim); font-weight: 500; font-size: 8.5px; border-bottom: 1px solid var(--line); }
      td.who { font-weight: 600; }
      td.who .c { display: block; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
      col.cName { width: 15%; } col.cGoal { width: 19%; } col.cWhy { width: 33%; } col.cNeed { width: 33%; }

      .foot {
        margin-top: 9px; padding-top: 6px; border-top: 1px solid var(--line);
        font-size: 9px; color: var(--dim); display: flex; justify-content: space-between;
      }

      .gate { width: 320px; margin: 18vh auto; background: #fff; padding: 20px; border-radius: 6px; }
      .gate h1 { font-size: 15px; }
      label { display: block; font-size: 11px; color: var(--muted); margin: 12px 0 5px; }
      input {
        width: 100%; padding: 8px 10px; font: inherit; font-size: 14px;
        border: 1px solid var(--line); border-radius: 6px;
      }
      button {
        font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
        width: 100%; margin-top: 9px; padding: 9px; min-height: 36px;
        background: var(--ink); color: #fff; border: 0; border-radius: 6px;
      }
      input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .err { color: #b3261e; font-size: 11px; margin-top: 8px; min-height: 16px; }

      @media (pointer: coarse) { button, input { min-height: 44px; } }

      @page { size: A4 portrait; margin: 0; }
      @media print {
        html, body { background: #fff; }
        .sheet { margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 10mm 11mm; }
        .gate { display: none; }
      }
    </style>
  </head>
  <body>
    <section class="gate" id="gate">
      <h1>InvestNow&trade; Circle</h1>
      <label for="pass">รหัสผ่าน</label>
      <input id="pass" type="password" autocomplete="current-password" />
      <button id="go">เปิดดูสรุป</button>
      <p class="err" id="err"></p>
    </section>

    <div class="sheet" id="sheet" hidden></div>

    <script>
      const el = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? '').replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
        );

      // Splitting on ", " would cut a free-text answer that contains a comma,
      // so everything the respondent typed is pooled under one "อื่นๆ" entry.
      function tally(rows, key) {
        const counts = new Map();
        let other = 0;
        rows.forEach((r) => {
          const raw = String(r[key] || '');
          const otherAt = raw.indexOf('อื่นๆ:');
          const listed = otherAt === -1 ? raw : raw.slice(0, otherAt);
          if (otherAt !== -1) other += 1;
          listed
            .split(', ')
            .map((v) => v.trim())
            .filter(Boolean)
            .forEach((v) => counts.set(v, (counts.get(v) || 0) + 1));
        });
        const out = [...counts.entries()].sort((a, b) => b[1] - a[1]);
        return { listed: out, other };
      }

      /** Keeps the top entries but never drops the free-text bucket. */
      function topWithOther({ listed, other }, limit) {
        const head = listed.slice(0, other ? limit - 1 : limit);
        return other ? [...head, ['อื่นๆ ที่ระบุเอง', other]] : head;
      }

      /** Borda-style score: an option scores more the higher a person ranked it. */
      function rankScore(rows) {
        const score = new Map();
        const firsts = new Map();
        rows.forEach((r) => {
          String(r.ranking || '')
            .split('>')
            .map((p) => p.trim())
            .filter(Boolean)
            .forEach((p) => {
              const m = p.match(/^(\d+)\.\s*(.+)$/);
              if (!m) return;
              const pos = Number(m[1]);
              const label = m[2].trim();
              score.set(label, (score.get(label) || 0) + Math.max(0, 7 - pos));
              if (pos === 1) firsts.set(label, (firsts.get(label) || 0) + 1);
            });
        });
        return { ranked: [...score.entries()].sort((a, b) => b[1] - a[1]), firsts };
      }

      function bars(items, format) {
        if (!items.length) return '';
        const max = items[0][1] || 1;
        return items
          .map(
            ([label, n], i) => `
          <div class="row${i === 0 ? ' lead' : ''}">
            <div>
              <div class="lab">${esc(label)}</div>
              <div class="track"><div class="fill" style="width:${(n / max) * 100}%"></div></div>
            </div>
            <div class="num">${format(n)}</div>
          </div>`
          )
          .join('');
      }

      function render(rows) {
        const total = rows.length;
        const { ranked, firsts } = rankScore(rows);
        const assets = tally(rows, 'assets');
        const apps = tally(rows, 'apps');
        const drinks = tally(rows, 'drinks');

        const weightTotal = ranked.reduce((sum, [, v]) => sum + v, 0) || 1;
        const goalRows = ranked.map(([label, v]) => [label, Math.round((v / weightTotal) * 100)]);

        const pct = (n) => n + '%';
        const people = (n) => n + ' คน';

        const clean = (t) => String(t || '').replace(/\s+/g, ' ').trim();
        const topGoal = (r) => {
          const m = String(r.ranking || '').split('>')[0].match(/^\s*1\.\s*(.+)$/);
          return m ? m[1].trim() : '';
        };

        const roster = rows
          .map(
            (r) => `<tr>
              <td class="who">${esc(clean(r.name) || 'ไม่ระบุชื่อ')}<span class="c">${esc(clean(r.contact))}</span></td>
              <td>${esc(topGoal(r))}</td>
              <td>${esc(clean(r.asset_reason))}</td>
              <td>${esc(clean(r.support_message))}</td>
            </tr>`
          )
          .join('');

        const drinkLine = topWithOther(drinks, 7)
          .map(([k, n]) => `<b>${esc(k)}</b> <span>${n}</span>`)
          .join(' &nbsp;·&nbsp; ');

        const latest = rows[0] ? rows[0].timestamp : '';

        el('sheet').innerHTML = `
          <div class="top">
            <h1>InvestNow&trade; Circle &mdash; สรุปผลแบบสำรวจ</h1>
            <div class="meta">${total} คำตอบ &nbsp;·&nbsp; ล่าสุด ${esc(latest)}</div>
          </div>
          <div class="rule"></div>

          <div class="kpis">
            <div class="kpi"><div class="v n">${total}</div><div class="k">คำตอบ</div></div>
            <div class="kpi"><div class="v">${esc(ranked[0] ? ranked[0][0] : '-')}</div><div class="k">เป้าหมายที่กลุ่มให้น้ำหนักสูงสุด</div></div>
            <div class="kpi"><div class="v">${esc(assets.listed[0] ? assets.listed[0][0] : '-')}</div><div class="k">สินทรัพย์ที่สนใจมากที่สุด</div></div>
            <div class="kpi"><div class="v">${esc(apps.listed[0] ? apps.listed[0][0] : '-')}</div><div class="k">แอปที่ใช้มากที่สุด</div></div>
          </div>

          <div class="cols">
            <section>
              <h2>เป้าหมายการลงทุน</h2>
              ${bars(goalRows, pct)}
            </section>

            <section>
              <h2>สินทรัพย์ที่สนใจ</h2>
              ${bars(topWithOther(assets, 9), people)}
            </section>

            <section>
              <h2>แอปที่ใช้ลงทุน</h2>
              ${bars(topWithOther(apps, 7), people)}
            </section>

            <section>
              <h2>เครื่องดื่มในงานมีตติ้ง</h2>
              <p class="inline">${drinkLine}</p>
            </section>
          </div>

          <section>
            <h2>รายคน</h2>
            <table>
              <colgroup><col class="cName" /><col class="cGoal" /><col class="cWhy" /><col class="cNeed" /></colgroup>
              <thead>
                <tr><th>ผู้ตอบ</th><th>เป้าหมายอันดับ 1</th><th>ทำไมสนใจสินทรัพย์เหล่านี้</th><th>อยากให้ซัพพอร์ต</th></tr>
              </thead>
              <tbody>${roster}</tbody>
            </table>
          </section>

          <div class="foot">
            <span>ข้อมูล ณ ${new Date().toLocaleDateString('th-TH', { day: 'numeric', month: 'long', year: 'numeric' })}</span>
          </div>`;
      }

      el('go').addEventListener('click', async () => {
        el('err').textContent = '';
        try {
          const res = await fetch('/.netlify/functions/results', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ passphrase: el('pass').value }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error || 'เปิดดูไม่สำเร็จ');
          el('gate').hidden = true;
          el('sheet').hidden = false;
          render(body.rows || []);
        } catch (e) {
          el('err').textContent = e.message;
        }
      });
      el('pass').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') el('go').click();
      });
    </script>
  </body>
</html>
